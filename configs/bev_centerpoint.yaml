# BEV occupancy detector with a CenterPoint head (Phase 2).
# Every field is optional: anything left out takes the default from waymo_lidar/det/config.py.
# Override on the command line with dotted keys, e.g. --set train.batch_size=8 grid.extra_channels=true
# Field reference: docs/detector/config.md

grid:                       # voxel grid in the vehicle frame, metres
  x_range: [-75.2, 75.2]    # -> 1504 cells at 0.1 m
  y_range: [-75.2, 75.2]    # -> 1504 cells
  z_range: [-2.0, 4.0]      # -> 24 slices at 0.25 m = 24 binary input channels
  voxel_size: [0.1, 0.1, 0.25]
  extra_channels: false     # true: + log1p(point count) and max intensity per BEV cell (26 channels)

data:
  classes: [vehicle, pedestrian, cyclist]   # heatmap channel order
  returns: [1, 2]           # top LiDAR returns to use
  frame_interval_train: 5   # every 5th frame (~31.6k training frames per epoch)
  frame_interval_eval: 5
  shuffle_buffer: 128       # frames per DataLoader worker (~2.3 MB each)
  num_workers: 12
  min_points_train: 1       # drop training boxes with no top-LiDAR points

augment:
  flip_y_prob: 0.5          # mirror across the x axis
  rotation_range: 0.7853981633974483   # global yaw in [-pi/4, pi/4]
  scale_range: [0.95, 1.05]

target:
  out_stride: 4             # heatmap 376 x 376, 0.4 m cells
  max_objects: 500
  gaussian_overlap: 0.1
  min_radius: 2             # heatmap cells

model:
  stem_channels: 32         # stride 2
  stage_channels: [64, 128, 256]   # strides 4, 8, 16
  stage_blocks: [2, 3, 3]
  neck_channels: 128        # merged at stride 4
  head_channels: 64
  heatmap_bias: -2.19       # initial foreground probability ~0.1

loss:
  focal_alpha: 2.0
  focal_beta: 4.0
  reg_weight: 0.25
  code_weights: [1, 1, 1, 1, 1, 1, 1, 1]   # offset x, y | z | log l, w, h | sin, cos

decode:
  topk: 500
  score_threshold: 0.1
  nms: none                 # none: 3x3 max-pool peaks only | bev: + rotated BEV NMS
  nms_iou: [0.7, 0.5, 0.5]  # per class, used when nms: bev

eval:
  iou_thresholds: [0.5, 0.7, 0.8]   # BEV and 3D AP at each
  distance_bins: [0, 30, 50, 75]    # metres

optim:
  name: adamw               # adamw | adam | sgd
  lr: 0.003
  weight_decay: 0.01
  betas: [0.9, 0.99]        # adam/adamw only; for sgd remove this and set momentum / nesterov

train:
  batch_size: 4
  epochs: 12
  grad_clip: 35.0           # max gradient norm, 0 = off
  precision: bf16           # bf16 | fp16 | fp32
  eval_every: 2             # epochs
  seed: 0
  runs_dir: runs
