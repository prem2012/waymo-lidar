[project]
name = "waymo-lidar"
version = "0.1.0"
description = "LiDAR 3D detection on Waymo Open Dataset v2: data tooling, analytics and visualization"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=17",
    "polars>=1.10",
    "rerun-sdk==0.41.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "torch>=2.15.0",
    "pyyaml>=6.0.3",
    "torchvision>=0.29.2",
]

[project.scripts]
wl = "waymo_lidar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "shapely>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waymo_lidar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
